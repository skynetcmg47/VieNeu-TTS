name: Publish ONNX Image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/onnx-image.yml
      - docker/Dockerfile.cpu
      - docker/Dockerfile.cpu.dockerignore
      - src/**
      - apps/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}-onnx
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build AMD64 CPU API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile.cpu
          target: api
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vieneu-onnx
          cache-to: type=gha,mode=max,scope=vieneu-onnx

      - name: Check CPU dependencies and Cloud Run startup without model downloads
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run --rm -i "$IMAGE" python - <<'PY'
          import importlib.util
          import os
          from importlib.metadata import distributions
          from unittest.mock import patch

          import onnxruntime
          from apps import openai_speech as api

          assert "CPUExecutionProvider" in onnxruntime.get_available_providers()
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("torchaudio") is None
          assert not any(dist.metadata["Name"].lower().startswith("nvidia-") for dist in distributions())
          assert os.environ["VIENEU_BACKEND"] == "onnx"
          assert os.environ["VIENEU_DEVICE"] == "cpu"
          assert os.environ["VIENEU_WATERMARK"] == "0"
          for port in (8080, 9090):
              with patch.dict(os.environ, PORT=str(port)), patch.object(api.uvicorn, "run") as server:
                  api.main()
                  server.assert_called_once_with(api.app, host="0.0.0.0", port=port, workers=1, log_level="info")
          print("CPU-only dependencies and Cloud Run port handling verified")
          PY

      - name: Push checked image to GHCR
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            docker push "$image"
          done <<< "$IMAGE_TAGS"
